services:
  - type: web
    name: jaddahh-ai-bot  # الاسم الجديد هنا
    env: docker
    plan: free 
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SALLA_CLIENT_ID
        sync: false
      - key: SALLA_CLIENT_SECRET
        sync: false
      - key: SALLA_WEBHOOK_SECRET
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
    # تم حذف قسم disk لأن الخطة المجانية لا تدعمه
